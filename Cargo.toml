[package]
name = "room"
description = "Rust SDK for Absurd durable workflows"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mbr/room-rs"
documentation = "https://docs.rs/room"
readme = "README.md"
keywords = ["postgres", "workflow", "queue", "durable"]
categories = ["asynchronous", "database"]

[dependencies]
futures = "0.3.31"
jiff = { version = "0.2.15", features = ["serde"] }
pin-project-lite = "0.2.16"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
pgdb = "0.6.0"
